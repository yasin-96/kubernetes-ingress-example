apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myapp-ingress
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.backendHost }}
      http:
        paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: hello
              port:
                number: 8080
    - host: {{ .Values.ingress.frontendHost }}
      http:
        paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: hello-frontend
              port:
                number: 80